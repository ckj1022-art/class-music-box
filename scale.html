<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音階練習｜班級音樂盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f4f1ff;--muted:rgba(225,235,255,.8);--gold:#ffd77a;--panel:rgba(8,18,66,.66);--line:rgba(255,255,255,.28);--cream1:#fffaf0;--cream2:#f6ecd0;--navy:#17235f;--fs:clamp(13px,min(1.15vw,2vh),26px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#1b2f8f;min-height:100dvh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(10,18,70,.55),rgba(10,18,70,.3) 35%,rgba(10,18,70,.55)),url("bg.jpg") 50% 55%/cover no-repeat}
  .wrap{position:relative;z-index:1;width:100%;min-height:100dvh;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
  header{display:flex;align-items:center;gap:12px}
  header h1{flex:1;font-size:clamp(22px,min(3.4vw,4.6vh),54px);font-weight:900;letter-spacing:.08em;line-height:1.1;
    background:linear-gradient(180deg,#fff 10%,#fff1c4 55%,#e9b44c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(30,40,120,.55)) drop-shadow(0 0 16px rgba(255,220,140,.3))}
  header h1 small{display:block;font-size:.34em;font-weight:500;letter-spacing:.3em;-webkit-text-fill-color:var(--gold)}
  .btn{font:inherit;font-weight:700;font-size:var(--fs);color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap;
    padding:.45em .9em;border-radius:999px;background:var(--panel);border:1.5px dashed rgba(255,255,255,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .btn:hover,.btn:focus-visible{box-shadow:0 0 16px rgba(255,236,170,.45);outline:none}
  .btn.primary{background:linear-gradient(180deg,var(--cream1),var(--cream2));color:var(--navy);border:none;box-shadow:0 2px 0 rgba(120,100,40,.25),0 0 18px rgba(255,236,170,.45)}
  .btn:active{transform:scale(.96)}
  .btn.sq{padding:.45em .7em}
  .panel{background:var(--panel);border-radius:22px;border:1.5px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(4,10,50,.3)}

  /* 樂譜區＋這個音 */
  .top{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(150px,15vw,300px);grid-template-rows:minmax(0,1fr);gap:10px}
  .staffbox{position:relative;min-height:200px;background:linear-gradient(180deg,#fffdf6,#fbf3dc);border-radius:22px;border:3px solid rgba(255,255,255,.85);
    box-shadow:0 8px 30px rgba(4,10,50,.35);overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:4px 6px 10px;scroll-behavior:smooth}
  .staffbox.over{box-shadow:0 0 0 4px var(--gold),0 8px 30px rgba(4,10,50,.35)}
  .sys{display:block;width:100%;height:auto}
  .sl{stroke:#232a66;stroke-width:1.8}
  .n{color:#232a66;cursor:grab}
  .n.now{color:#e08a00}
  .n.ok{color:#1c9b6a}
  .n.cur{color:#e08a00;filter:drop-shadow(0 0 5px rgba(255,180,40,.9))}
  .n.pre{opacity:.5;color:#e08a00}
  .barbg{fill:transparent;cursor:pointer}
  .barbg.act{fill:rgba(255,190,60,.13)}
  .barbg.play{fill:rgba(255,190,60,.24)}
  .slot{fill:rgba(35,42,102,.06);stroke:rgba(35,42,102,.18);stroke-dasharray:5 5;pointer-events:none}
  .bnum{font-size:13px;fill:#8a8fb5;font-family:inherit}
  .tip{position:sticky;top:0;z-index:2;text-align:center;font-size:clamp(12px,1.5vh,20px);color:#7b7fa8;pointer-events:none;padding:2px 0}

  .info{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;padding:.9em .8em;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,#fff8d6,#ffe9a2);color:#5a4500;border-radius:22px;border:3px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(4,10,50,.35);
    font-size:clamp(13px,min(1.25vw,2.2vh),30px)}
  .info .cap{font-size:.8em;font-weight:700;letter-spacing:.2em;color:#fff;background:#e0a020;border-radius:999px;padding:.2em 1em}
  .info .big{font-size:3.2em;font-weight:900;line-height:1.05;color:#e08a00}
  .info .mini{width:66%;max-width:9em;height:auto;background:#fffdf6;border-radius:.6em;box-shadow:inset 0 0 0 2px rgba(90,69,0,.12)}
  .tiles{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.4em}
  .tile{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.35em .3em;border-radius:.7em;background:rgba(255,255,255,.62)}
  .tile.wide{grid-column:1/-1}
  .tile span{font-size:.72em;font-weight:500;opacity:.7;letter-spacing:.1em}
  .tile b{font-size:1.2em;font-weight:900;line-height:1.2}
  .info .q{display:none;flex-direction:column;align-items:center;gap:.3em;font-weight:700}
  .info .q b{font-size:4.4em;line-height:1;color:#e08a00}
  .info .q small{font-size:.8em;font-weight:500;opacity:.7}
  .info.cover>*{display:none}
  .info.cover .q{display:flex}

  /* 控制列 */
  .ctrl{display:flex;flex-direction:column;gap:6px;padding:7px 10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .grp{display:inline-flex;align-items:center;gap:5px}
  .lab{font-size:var(--fs);font-weight:700;color:var(--muted);white-space:nowrap}
  .seg{display:inline-flex;border-radius:999px;overflow:hidden;background:rgba(8,18,66,.5);border:1.5px dashed rgba(255,255,255,.45)}
  .seg button{font:inherit;font-weight:700;font-size:var(--fs);padding:.42em .75em;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:999px;white-space:nowrap}
  .seg button.on{background:linear-gradient(180deg,var(--cream1),var(--cream2));color:var(--navy)}
  select{font:inherit;font-weight:700;font-size:var(--fs);color:var(--navy);background:linear-gradient(180deg,var(--cream1),var(--cream2));border:none;border-radius:999px;padding:.42em .8em;cursor:pointer}
  .field input{accent-color:var(--gold);width:clamp(70px,8vw,150px)}
  .tray{display:inline-flex;align-items:center;gap:.35em;padding:.25em .8em .25em .45em;border-radius:999px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    font-weight:700;font-size:var(--fs);color:var(--navy);background:linear-gradient(180deg,#fff1c4,#ffd77a);box-shadow:0 2px 0 rgba(120,100,40,.3),0 0 18px rgba(255,236,170,.5)}
  .tray svg{width:1.8em;height:1.8em}
  .durs{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:16px;background:rgba(8,18,66,.5);border:1.5px dashed rgba(255,255,255,.45)}
  .dur{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(36px,3.3vw,64px);height:clamp(40px,4.4vh,72px);border:0;border-radius:12px;cursor:pointer;
    background:transparent;color:#fff;font:inherit;padding:0}
  .dur svg{width:62%;height:68%}
  .dur small{font-size:clamp(9px,.85vw,15px);font-weight:700;line-height:1;opacity:.85}
  .dur.on{background:linear-gradient(180deg,var(--cream1),var(--cream2));color:var(--navy)}
  .dur:disabled{opacity:.25;cursor:not-allowed}
  .durs .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.3);margin:4px 2px}
  .ghost{position:fixed;z-index:60;pointer-events:none;width:46px;height:46px;transform:translate(-50%,-50%);color:#e08a00;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .msg{flex:1;min-width:12em;font-size:var(--fs);font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(4,10,50,.8);min-height:1.4em;padding:0 4px}
  .keyname{font-weight:900;color:var(--gold);font-size:var(--fs);min-width:4.2em;text-align:center}

  /* 鋼琴 */
  .piano{position:relative;height:clamp(110px,22vh,380px);padding:7px;border-radius:20px;background:#10194f;border:1.5px solid rgba(255,255,255,.2);box-shadow:0 8px 30px rgba(4,10,50,.4);touch-action:none;user-select:none;-webkit-user-select:none}
  .keys{position:relative;width:100%;height:100%;display:flex;gap:3px}
  .wk{flex:1;position:relative;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#fff,#eef0f8);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:5%;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .06s,background .06s}
  .wk small{font-size:clamp(10px,1.5vh,20px);font-weight:700;color:var(--kc)}
  .wk b{font-size:clamp(13px,2.4vh,34px);font-weight:900;color:#232a66;line-height:1.1}
  .wk em{position:absolute;top:40%;left:6%;font-style:normal;font-size:clamp(8px,1.2vh,15px);font-weight:700;color:#fff;background:#f08a5d;border-radius:6px;padding:1px 4px}
  .wk.down{background:linear-gradient(180deg,#ffe9a8,#ffd15c);transform:translateY(4px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 0 18px rgba(255,220,140,.8)}
  .wk.bad{background:linear-gradient(180deg,#ffd0d6,#ff9aa8)}
  .bk{position:absolute;top:0;height:58%;border-radius:0 0 7px 7px;background:linear-gradient(180deg,#2a2f4a,#0b0d1c);cursor:pointer;z-index:2;box-shadow:inset 0 -5px 0 rgba(255,255,255,.12),0 3px 6px rgba(0,0,0,.4)}
  .bk.inkey::after{content:"";position:absolute;left:50%;bottom:8%;width:34%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--gold)}
  .bk.down{background:linear-gradient(180deg,#8a7420,#4a3c10);transform:translateY(3px)}
  .bk.bad{background:linear-gradient(180deg,#a84a5a,#5a1f2a)}

  @media (min-width:761px) and (orientation:landscape){
    .wrap{height:100dvh}
    .staffbox{min-height:0}
  }
  @media (max-width:760px){
    .top{grid-template-columns:1fr}
    .info{flex-direction:row;flex-wrap:wrap;padding:.5em .7em;gap:.6em}
    .info .cap{display:none}
    .info .big{font-size:2.2em}
    .info .mini{width:4.6em}
    .tiles{flex:1;width:auto;grid-template-columns:1fr 1fr 1.4fr}
    .tile.wide{grid-column:auto}
    .info.cover .q{flex-direction:row;width:100%;justify-content:center} .info .q b{font-size:2em}
    .staffbox{min-height:240px;max-height:46vh}
    .dur{width:34px;height:40px}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>音階練習<small>SCALE · 五線譜和鋼琴鍵</small></h1>
    <a class="btn" href="index.html">← 回音樂盒</a>
  </header>

  <div class="top">
    <div class="staffbox" id="staffbox">
      <div class="tip" id="tip">選好音符長短，把金色音符拖到小節裡；點小節可以指定要寫在哪一小節</div>
      <div id="systems"></div>
    </div>
    <aside class="info cover" id="info" role="button" tabindex="0" aria-live="polite" aria-label="這個音的答案，點一下顯示或蓋住">
      <span class="q"><b>？</b>這是什麼音？<small>點一下看答案</small></span>
      <span class="cap">這個音</span>
      <span class="big" id="iSol">–</span>
      <svg class="mini" id="iMini" viewBox="0 0 120 84" aria-hidden="true"></svg>
      <div class="tiles">
        <div class="tile"><span>音名</span><b id="iLet">–</b></div>
        <div class="tile"><span>簡譜</span><b id="iNum">–</b></div>
        <div class="tile wide"><span>位置</span><b id="iPos">–</b></div>
      </div>
    </aside>
  </div>

  <div class="panel ctrl">
    <div class="row">
      <span class="grp"><span class="lab">譜號</span><span class="seg" id="segClef"><button data-v="treble" class="on">𝄞 高音</button><button data-v="bass">𝄢 低音</button></span></span>
      <span class="grp"><span class="lab">調號</span><select id="keySel" aria-label="調號"></select>
        <button class="btn sq" id="tDown" title="整首往下移調">▼ 降調</button><button class="btn sq" id="tUp" title="整首往上移調">▲ 升調</button></span>
      <span class="grp"><span class="lab">拍號</span><span class="seg" id="segTime"><button data-v="2/4">2/4</button><button data-v="3/4">3/4</button><button data-v="4/4" class="on">4/4</button><button data-v="3/8">3/8</button><button data-v="6/8">6/8</button></span></span>
      <span class="grp"><span class="lab">小節</span><button class="btn sq" id="barMinus" aria-label="減少一小節">－</button><b class="keyname" id="barCount" style="min-width:2.4em">2</b><button class="btn sq" id="barPlus" aria-label="增加一小節">＋</button></span>
      <label class="grp field"><span class="lab">速度</span><input type="range" id="tempo" min="50" max="160" step="2" value="90"><b class="keyname" id="tempoTxt" style="min-width:2.4em">90</b></label>
    </div>
    <div class="row">
      <div class="tray" id="tray" role="button" aria-label="拖曳音符到五線譜"><svg viewBox="0 0 40 40"><ellipse cx="16" cy="29" rx="9" ry="6.6" transform="rotate(-20 16 29)" fill="currentColor"/><path d="M24 27V5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span id="trayTxt">拖我</span></div>
      <div class="durs" id="durs" role="group" aria-label="音符長短"></div>
      <span class="seg" id="segMode"><button data-v="write" class="on">寫一寫</button><button data-v="find">找一找</button></span>
      <span class="seg" id="segMix"><button data-v="q" class="on">只出四分</button><button data-v="mix">混合節奏</button></span>
      <button class="btn primary" id="randBtn">🎲 隨機出題</button>
    </div>
    <div class="row">
      <button class="btn" id="undoBtn">↩ 退一個</button>
      <button class="btn" id="clearBtn">清空</button>
      <span class="seg" id="segCover"><button data-v="on" class="on">答案先蓋住</button><button data-v="off">直接顯示</button></span>
      <div class="msg" id="msg"></div>
      <button class="btn primary" id="playBtn">▶ 依序播放</button>
    </div>
  </div>

  <div class="piano"><div class="keys" id="keys"></div></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ================= 樂理資料 ================= */
  // 音高以「自然音階步數」表示：0 = 中央 C（C4），1 = D4 … 7 = C5，-1 = B3
  const LETTER = ['C','D','E','F','G','A','B'], SOL = ['do','re','mi','fa','sol','la','si'];
  const NAT = [0,2,4,5,7,9,11];
  const KC = ['#e4572e','#f08a1c','#d9a400','#3fa34d','#1c9bb5','#3f6fe0','#9b5de5'];
  const mod = (n, m) => ((n % m) + m) % m;
  const KEYS = [   // 依主音由低到高排列（移調用）
    {id:'C',  name:'C 大調',  tonic:0, semi:0,  acc:''},
    {id:'D',  name:'D 大調',  tonic:1, semi:2,  acc:'#FC'},
    {id:'Eb', name:'E♭ 大調', tonic:2, semi:3,  acc:'bBEA'},
    {id:'E',  name:'E 大調',  tonic:2, semi:4,  acc:'#FCGD'},
    {id:'F',  name:'F 大調',  tonic:3, semi:5,  acc:'bB'},
    {id:'G',  name:'G 大調',  tonic:4, semi:7,  acc:'#F'},
    {id:'A',  name:'A 大調',  tonic:5, semi:9,  acc:'#FCG'},
    {id:'Bb', name:'B♭ 大調', tonic:6, semi:10, acc:'bBE'}
  ];
  const CLEFS = {
    treble:{bottom:2,  lo:-2,  hi:14, keyLo:-1,  keyHi:14, sharpPos:[10,7,11,8,5,9,6],   flatPos:[6,9,5,8,4,7,3]},
    bass:  {bottom:-10,lo:-14, hi:2,  keyLo:-14, keyHi:1,  sharpPos:[-4,-7,-3,-6,-9,-5,-8], flatPos:[-8,-5,-9,-6,-10,-7,-11]}
  };
  // 音符長短（以四分音符＝1 拍計）
  const DURS = [
    {id:'w',  v:4,   name:'全音符',     lab:'4'},
    {id:'h.', v:3,   name:'附點二分',   lab:'3'},
    {id:'h',  v:2,   name:'二分音符',   lab:'2'},
    {id:'q.', v:1.5, name:'附點四分',   lab:'1.5'},
    {id:'q',  v:1,   name:'四分音符',   lab:'1'},
    {id:'e.', v:.75, name:'附點八分',   lab:'¾'},
    {id:'e',  v:.5,  name:'八分音符',   lab:'½'},
    {id:'s',  v:.25, name:'十六分音符', lab:'¼'},
    {id:'W',  v:4,   name:'全休止符',   lab:'4',  rest:true},
    {id:'H',  v:2,   name:'二分休止符', lab:'2',  rest:true},
    {id:'Q',  v:1,   name:'四分休止符', lab:'1',  rest:true},
    {id:'E',  v:.5,  name:'八分休止符', lab:'½',  rest:true},
    {id:'S',  v:.25, name:'十六分休止符',lab:'¼', rest:true}
  ];
  const DBY = Object.fromEntries(DURS.map(d => [d.id, d]));

  /* ================= 狀態 ================= */
  let clef = 'treble', keyI = 0, num = 4, den = 4, bars = [[], []], active = 0;
  let selDur = 'q', mode = 'write', randMix = false, coverOn = true, tempo = 90;
  let cur = null, done = new Set(), nowRef = null, playBar = -1, playing = false, playT = [], preview = null;
  const barLen = () => num * 4 / den;                         // 一小節有幾個四分音符長
  const keyAcc = () => { const k = KEYS[keyI]; const t = k.acc[0]; const m = {}; for (const L of k.acc.slice(1)) m[L] = t === '#' ? 1 : -1; return m; };
  const alter = d => keyAcc()[LETTER[mod(d,7)]] || 0;
  const midiOf = d => 60 + 12*Math.floor(d/7) + NAT[mod(d,7)] + alter(d);
  const used = b => bars[b].reduce((a, n) => a + DBY[n.t].v, 0);
  const left = b => +(barLen() - used(b)).toFixed(4);
  const accSign = a => a > 0 ? '♯' : a < 0 ? '♭' : '';

  /* ================= 聲音 ================= */
  let ctx = null;
  function tone(midi, vel, len){
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state !== 'running') ctx.resume();
      const t = ctx.currentTime + .005, f = 440*Math.pow(2,(midi-69)/12), out = ctx.createGain(); out.gain.value = vel || .9; out.connect(ctx.destination);
      const off = t + (len || 2);
      for (let n = 1; n <= 7; n++){
        const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f*n*(1+.0004*n*n);
        const a = .32*Math.pow(n,-1.2)*Math.exp(-(n-1)*.35);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.005); g.gain.setTargetAtTime(0,t+.005,1.1/(1+n*.5));
        if (len) g.gain.setTargetAtTime(0, off, .08);
        o.connect(g).connect(out); o.start(t); o.stop(off + .8);
      }
    } catch(e){}
  }
  ['click','touchend'].forEach(ev => addEventListener(ev, () => { if (ctx && ctx.state !== 'running') try { ctx.resume(); } catch(e){} }, true));

  /* ================= 鋼琴鍵（隨譜號換音域） ================= */
  const keysEl = $('keys'); let downEls = [], downTimer = 0;
  function buildPiano(){
    const C = CLEFS[clef], whites = [];
    for (let d = C.keyLo; d <= C.keyHi; d++) whites.push(d);
    const acc = keyAcc();
    let h = whites.map(d => { const L = mod(d,7);
      return `<div class="wk" data-m="${60 + 12*Math.floor(d/7) + NAT[L]}" style="--kc:${KC[L]}">${d === 0 ? '<em>中央C</em>' : ''}<small>${SOL[L]}</small><b>${LETTER[L]}</b></div>`; }).join('');
    const w = 100 / whites.length;
    whites.forEach((d, i) => { const L = mod(d,7); if (i === whites.length-1 || L === 2 || L === 6) return;
      const m = 60 + 12*Math.floor(d/7) + NAT[L] + 1, inkey = acc[LETTER[L]] === 1 || acc[LETTER[mod(d+1,7)]] === -1;
      h += `<div class="bk${inkey ? ' inkey' : ''}" data-m="${m}" style="left:${(i+1)*w - w*.3}%;width:${w*.6}%"></div>`; });
    keysEl.innerHTML = h;
  }
  function lightKey(midi, hold){
    downEls.forEach(e => e.classList.remove('down')); clearTimeout(downTimer);

    if (g && g.dataset.b !== undefined && !g.classList.contains('pre')){
      const from = {b:+g.dataset.b, i:+g.dataset.i};
      if (mode === 'find'){ const n = bars[from.b][from.i]; if (done.has(from.b + ':' + from.i) && n.p !== null) pressStep(n.p); return; }
      return startDrag(e, from);
    }
    const bg = e.target.closest('.barbg');
    if (bg && mode === 'write'){ active = +bg.dataset.bar; render(); say(`接下來寫在第 ${active+1} 小節。`); }
  });

  /* ================= 出題 ================= */
  function randomFill(){
    stopPlay();
    const C = CLEFS[clef]; let p = C.bottom + 1 + Math.floor(Math.random()*6), first = true;
    const step = () => { if (first){ first = false; return p; } let q; do { q = p + Math.floor(Math.random()*7) - 3; } while (q < C.bottom - 2 || q > C.bottom + 10 || q === p); return p = q; };
    const N = t => ({p: step(), t});
    bars = bars.map((_, bi) => {
      const out = []; let rem = barLen();
      if (!randMix){ while (rem >= 1 - 1e-6){ out.push(N('q')); rem -= 1; } while (rem > 1e-6){ out.push(N('e')); rem -= .5; } return out; }
      const unit = den === 8 ? 1.5 : 1;
      while (rem > 1e-6){
        const r = Math.random(), atStart = Math.abs(rem - barLen()) < 1e-6;
        if (unit === 1){
          if (atStart && rem === 4 && r < .06) { out.push(N('w')); rem -= 4; continue; }
          if (rem >= 3 && r < .12) { out.push(N('h.')); rem -= 3; continue; }
          if (rem >= 2 && r < .28) { out.push(N('h')); rem -= 2; continue; }
          const k = Math.random();
          if (k < .34) out.push(N('q'));
          else if (k < .6) out.push(N('e'), N('e'));
          else if (k < .72) out.push(N('s'), N('s'), N('s'), N('s'));
          else if (k < .8) out.push(N('e'), N('s'), N('s'));
          else if (k < .87) out.push(N('s'), N('s'), N('e'));
          else if (k < .93) out.push(N('e.'), N('s'));
          else out.push(out.length && out[out.length-1].p !== null ? {p:null, t:'Q'} : N('q'));
          rem -= 1;
        } else {
          const k = Math.random();
          if (k < .3) out.push(N('q.'));
          else if (k < .55) out.push(N('q'), N('e'));
          else if (k < .82) out.push(N('e'), N('e'), N('e'));
          else if (k < .92) out.push(N('e'), N('q'));
          else out.push(N('e.'), N('s'), N('e'));
          rem -= 1.5;
        }
      }
      return out;
    });
    done = new Set(); nowRef = null; active = 0; cur = nextFind(null);
    render(); $('staffbox').scrollTop = 0;
    say(mode === 'find' ? '看金色的音符，在鋼琴上找到它！' : '出好題了！按「▶ 依序播放」聽聽看，也可以拖動音符改音高。');
  }
  function refs(){ const r = []; bars.forEach((bar, b) => bar.forEach((n, i) => { if (!DBY[n.t].rest) r.push(b + ':' + i); })); return r; }
  function nextFind(after){ const r = refs(); if (after === null) return r[0] || null; const k = r.indexOf(after); return r[k+1] || null; }
  function answer(m, k){
    if (!cur){ say('先按「🎲 隨機出題」。'); return; }
    const [b, i] = cur.split(':').map(Number), n = bars[b][i];
    if (m === midiOf(n.p)){
      pressStep(n.p); done.add(cur); cur = nextFind(cur);
      say(cur ? '答對了！下一個音在哪裡？' : '全部答對！太厲害了 ✦ 再按「🎲 隨機出題」挑戰下一題。'); render();
      if (cur) scrollToBar(+cur.split(':')[0]);
    } else {
      tone(m, .5); k.classList.add('bad'); setTimeout(() => k.classList.remove('bad'), 350);
      say(midiOf(n.p) > m ? '再高一點，往右邊找找看。' : '再低一點，往左邊找找看。');
    }
  }

  /* ================= 依序播放 ================= */
  function stopPlay(){ playT.forEach(clearTimeout); playT = []; playing = false; nowRef = null; playBar = -1; $('playBtn').textContent = '▶ 依序播放'; releaseKey(); render(); }
  $('playBtn').onclick = () => {
    if (playing) return stopPlay();
    if (!bars.some(b => b.length)){ say('五線譜上還沒有音符。'); return; }
    const spb = 60 / tempo * 1000; playing = true; $('playBtn').textContent = '■ 停止';
    let t = 0;
    bars.forEach((bar, b) => {
      let pos = 0;
      playT.push(setTimeout(() => { playBar = b; render(); scrollToBar(b); }, (b * barLen()) * spb));
      bar.forEach((n, i) => {
        const v = DBY[n.t].v, at = (b * barLen() + pos) * spb;
        playT.push(setTimeout(() => { nowRef = b + ':' + i;
          if (n.p !== null){ tone(midiOf(n.p), .9, v * spb / 1000 * .95); lightKey(midiOf(n.p)); showInfo(n.p); } else releaseKey();
          render(); }, at));
        pos += v;
      });
      t = (b + 1) * barLen() * spb;
    });
    playT.push(setTimeout(() => { stopPlay(); say('播完了！'); }, t + 300));
    say(`依序播放 ${bars.length} 個小節，速度 ${tempo}。`);
  };

  /* ================= 譜號／調號／移調／拍號 ================= */
  function seg(id, fn){ const el = $(id); el.querySelectorAll('button').forEach(b => b.onclick = () => { el.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.v); }); }
  seg('segClef', v => {
    stopPlay(); const shift = v === 'bass' ? -14 : 14; if (v === clef) return;
    clef = v; bars.forEach(bar => bar.forEach(n => { if (n.p !== null) n.p = Math.max(CLEFS[clef].lo, Math.min(CLEFS[clef].hi, n.p + shift)); }));
    buildPiano(); render(); say(v === 'bass' ? '換成低音譜號，音符一起往下移兩個八度。' : '換成高音譜號，音符一起往上移兩個八度。');
  });
  $('keySel').innerHTML = KEYS.map((k, i) => `<option value="${i}">${k.name}</option>`).join('');
  $('keySel').onchange = e => { stopPlay(); keyI = +e.target.value; buildPiano(); render(); say(`換成 ${KEYS[keyI].name}：譜上的音位置不變，音高照調號升降。`); };
  function transpose(dir){
    stopPlay();
    const nk = keyI + dir, wrap = nk < 0 ? -1 : nk >= KEYS.length ? 1 : 0, k2 = mod(nk, KEYS.length);
    const shift = KEYS[k2].tonic - KEYS[keyI].tonic + wrap * 7, C = CLEFS[clef];
    if (bars.some(bar => bar.some(n => n.p !== null && (n.p + shift < C.lo || n.p + shift > C.hi)))){ say('再移就超出這個譜號的音域了。'); return; }
    bars.forEach(bar => bar.forEach(n => { if (n.p !== null) n.p += shift; }));
    keyI = k2; $('keySel').value = keyI; buildPiano(); render();
    say(`移調到 ${KEYS[keyI].name}，整首旋律一起${dir > 0 ? '升高' : '降低'}。`);
  }
  $('tUp').onclick = () => transpose(1);
  $('tDown').onclick = () => transpose(-1);
  seg('segTime', v => {
    stopPlay(); [num, den] = v.split('/').map(Number);
    const all = bars.flat(), nb = []; let barN = [], rem = barLen();
    all.forEach(n => { const d = DBY[n.t].v; if (d > barLen() + 1e-6) return; if (d > rem + 1e-6){ nb.push(barN); barN = []; rem = barLen(); } barN.push(n); rem -= d; });
    if (barN.length) nb.push(barN);
    while (nb.length < Math.max(2, bars.length) && nb.length < 32) nb.push([]);
    bars = nb; active = 0; render(); say(`拍號改成 ${num}/${den}：每小節 ${num} 拍，以${den === 4 ? '四分' : '八分'}音符為一拍。`);
  });
  $('tempo').oninput = e => { tempo = +e.target.value; $('tempoTxt').textContent = tempo; if (playing) stopPlay(); };

  /* ================= 其他控制 ================= */
  seg('segMode', v => { stopPlay(); mode = v; $('tray').style.opacity = v === 'find' ? .4 : 1;
    $('tip').textContent = v === 'find' ? '看金色的音符，按下面對應的鋼琴鍵（黑鍵也算）' : '選好音符長短，把金色音符拖到小節裡；點小節可以指定要寫在哪一小節';
    if (v === 'find'){ if (!refs().length) randomFill(); done = new Set(); cur = nextFind(null); render(); say('看金色的音符，在鋼琴上找到它！'); } else { render(); say(''); } });
  seg('segMix', v => { randMix = v === 'mix'; });
  seg('segCover', v => { coverOn = v === 'on'; $('info').classList.toggle('cover', coverOn); });
  $('info').addEventListener('click', () => $('info').classList.toggle('cover'));
  $('info').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('info').click(); } });
  $('randBtn').onclick = randomFill;
  $('undoBtn').onclick = () => { stopPlay(); for (let b = bars.length - 1; b >= 0; b--) if (bars[b].length){ bars[b].pop(); active = b; break; } render(); };
  $('clearBtn').onclick = () => { stopPlay(); bars = bars.map(() => []); active = 0; done = new Set(); cur = null; render(); say('清空了，可以開始寫自己的旋律。'); };
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); $('playBtn').click(); } });
  let rw = 0; addEventListener('resize', () => { const w = perRow(); if (w !== rw){ rw = w; render(); } });
  function say(t){ $('msg').textContent = t; }

  buildPiano(); render(); rw = perRow();
  say('預設兩個小節；按「＋」可以加更多小節，「▶ 依序播放」會從第 1 小節一路播到最後。');
})();
</script>
</body>
</html>
